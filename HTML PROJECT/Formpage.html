
<!DOCTYPE html>
<html>
<head>
    <title>Home / X</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" href="./x s.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <style>
        body {
            background:linear-gradient( dodgerblue,white);
        }

        * {
            margin: 0;
            padding: 0;
            overflow: none;
            box-sizing: border-box;
        }

        .main {
            display: flex;
            gap: 40px;
            justify-content: center;
            align-items: center;
            margin-top: 10vh;
        }

        .main img {
            width: auto;
            height: 83vh;
        }

        .center {
            display: flex;
            flex-direction: column;
            gap: 3vh;
            align-items: center;
            border: 5px dotted dodgerblue;
            border-radius: 8px;
            width: 300px;
            height: 68.5vh;
            background: linear-gradient(to top left, white, darkblue);
        }
        .centers {
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 5px dotted dodgerblue;
            border-radius: 8px;
            width: 300px;
            height: 10vh;
            background: linear-gradient(to bottom left, white, darkblue);
            justify-content: center;
        }
        .centers span{
            font-family: Arial, Helvetica, sans-serif;
            color: rgba(255, 251, 251, 0.566);
        }
        

        .inputs {
            display: flex;
            flex-direction: column;
            gap: 1vh;
        }

        input {
            background-color: transparent;
            border: 3.3px dashed dodgerblue;
            height: 8vh;
            width: 250px;
            color: aliceblue;
        }
        .input:focus-within{
            border: none;
        }
        input::placeholder{
            color: dodgerblue;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        button {
            background-color: dodgerblue;
            width: 250px;
            height: 7vh;
            border: none;
            border-radius: 10vh;
        }

        button a {
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            text-decoration: none;
        }
        .frame{
            display: flex;
            flex-direction: column;
            gap: 1.7vh;
        }
        em{
            font-size: 60px;
            color: dodgerblue;
        }
    </style>
</head>

<body>

<div class="main">
    <img src="./TwitterApp.png" alt="">
    <div class="frame">
    <div class="center">
            <h1><em>Twitter</em></h1>
            <div class="inputs">
                <input placeholder="Username or email" type="text">
                <input placeholder="Password" type="text">
            </div>
            <button>
                <a href="Homepage.html">Log in</a>
            </button>
            <span>Or</span>
            <a href="#">Forgot password</a>
    </div>
    <div class="centers">
            <span>D'ont have an account?<a href="Landingpage.html">Sign up</a></span>
    </div>
    </div>
</body>

</html>
